apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api-deployment
  labels:
    app: churn-api
spec:
  # This tells K8s to always keep 2 identical copies (replicas) of your API running
  replicas: 2
  selector:
    matchLabels:
      app: churn-api
  template:
    metadata:
      labels:
        app: churn-api
    spec:
      containers:
      - name: churn-api-container
        # This is the local Docker image we just built
        image: localhost:5000/churn-api:latest
        # We tell K8s to use the local image instead of looking on the internet
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        # Best Practice: Always set resource limits so the ML model doesn't crash the server
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m" 
name: MLOps CI/CD Pipeline

# This tells GitHub to run this pipeline every time you push code to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Grab your code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up a Python environment on the GitHub server
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      # 3. Install your project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run your Data Preprocessing & Model Training to generate artifacts
      - name: Run ML Pipeline
        run: |
          python src/data/preprocess.py
          python src/models/train.py

      # 5. Run your automated PyTest suite to ensure everything worked
      - name: Run Tests
        run: |
          pytest -v tests/